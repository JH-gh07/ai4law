[project]
name = "ai4law"
version = "0.1.0"
description = "AI4Law v0 backend and streamlit demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "python-multipart>=0.0.20",
  "python-docx>=1.1.2",
  "pypdf>=5.4.0",
  "streamlit>=1.44.0",
  "requests>=2.32.0",
  "openai>=1.0.0",
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend"]

[tool.ruff]
line-length = 100
