[project]
name = "ai4law"
version = "0.1.0"
description = "DataComplyFlow auditable legal compliance workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "python-multipart>=0.0.20",
  "python-docx>=1.1.2",
  "pypdf>=5.4.0",
  "sqlalchemy>=2.0.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.0.0",
  "requests>=2.32.0",
  "openai>=1.0.0",
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend"]
markers = [
  "slow: deterministic tests that are intentionally expensive"
]

[tool.ruff]
line-length = 100
